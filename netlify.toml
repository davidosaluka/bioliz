[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[template.environment]
  NEXT_PUBLIC_SUPABASE_URL = "Add your Supabase URL"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "Add your Supabase anon key"
  SUPABASE_SERVICE_ROLE_KEY = "Add your Supabase service role key"
  NEXT_PUBLIC_SITE_URL = "Add your public site URL"
  PAYSTACK_SECRET_KEY = "Add your Paystack secret key"
  NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY = "Add your Paystack public key"
  RESEND_API_KEY = "Add your Resend API key (optional)"
  EMAIL_FROM = "Add your verified sender email (optional)"
  VENDOR_NOTIFY_EMAIL = "Add vendor alert email (optional)"
  CRON_SECRET = "Add a random cron secret"
